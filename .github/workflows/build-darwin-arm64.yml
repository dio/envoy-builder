name: Build Envoy (darwin-arm64)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA, branch, or tag'
        required: false
        default: 'main'
        type: string
      repo:
        description: 'Source repository (owner/repo)'
        required: false
        default: 'envoyproxy/envoy'
        type: string
      patch_url:
        description: 'URL to a .patch file to apply before building (optional)'
        required: false
        type: string

      macos_minimum_os:
        description: 'Optional minimum macOS version (for example 15.0); requires release_tag'
        required: false
        type: string
      release_tag:
        description: 'Separate release tag for a deployment-target variant'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.MINI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install envoy-mini-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.7.5 \
            --repo dio/envoy-mini-builder \
            --pattern '*linux_amd64*.tar.gz' \
            --output /tmp/emb.tar.gz
          tar -xzf /tmp/emb.tar.gz -C /tmp envoy-mini-builder
          sudo mv /tmp/envoy-mini-builder /usr/local/bin/envoy-mini-builder
          envoy-mini-builder --version

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDBUDDY_API_KEY_DARWIN_ARM64: ${{ secrets.BUILDBUDDY_API_KEY_DARWIN_ARM64 }}
          SOURCE_SHA: ${{ inputs.sha || 'main' }}
          SOURCE_REPO: ${{ inputs.repo || 'envoyproxy/envoy' }}
          PATCH_URL: ${{ inputs.patch_url }}
          MACOS_MINIMUM_OS: ${{ inputs.macos_minimum_os }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=()
          if [[ -n "$PATCH_URL" ]]; then
            args+=(--patch "$PATCH_URL")
          fi
          if [[ -n "$MACOS_MINIMUM_OS" ]]; then
            [[ "$MACOS_MINIMUM_OS" =~ ^[0-9]+\.[0-9]+$ ]] || { echo 'Invalid macOS version'; exit 1; }
            [[ -n "$RELEASE_TAG" ]] || { echo 'A deployment-target variant requires a separate release_tag'; exit 1; }
            args+=("--bazel-arg=--macos_minimum_os=$MACOS_MINIMUM_OS"
                   "--bazel-arg=--host_macos_minimum_os=$MACOS_MINIMUM_OS"
                   "--bazel-arg=--copt=-mmacosx-version-min=$MACOS_MINIMUM_OS"
                   "--bazel-arg=--linkopt=-mmacosx-version-min=$MACOS_MINIMUM_OS"
                   "--bazel-arg=--define=no_debug_info=1")
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          envoy-mini-builder build \
            --sha "$SOURCE_SHA" \
            --repo "$SOURCE_REPO" \
            --host dio@mini \
            --platform darwin-arm64 \
            --gh-repo dio/envoy-builder \
            "${args[@]}"
